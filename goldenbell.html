<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚀 우주 퀴즈 QR 골든벨</title>
<style>
  :root{
    --bg1:#0b0c2a;
    --bg2:#1b1e4b;
    --accent:#5b8dff;
    --accent2:#ffcb5b;
    --danger:#ff5b6e;
    --ok:#4ce0a1;
    --card:#ffffff;
    --text-dark:#1c1c3a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:radial-gradient(ellipse at top, var(--bg2), var(--bg1));
    color:#fff;
    /* 보안: 텍스트 드래그/선택 방지 */
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    overflow-x:hidden;
  }
  img, a { -webkit-user-drag:none; user-drag:none; }
  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:20px 16px 40px;
    max-width:480px;
    margin:0 auto;
  }
  .screen{ width:100%; display:none; animation:fadeIn .35s ease; }
  .screen.active{ display:flex; flex-direction:column; align-items:center; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .stars{ position:fixed; inset:0; z-index:-1; overflow:hidden; }
  .stars span{
    position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
    opacity:.7; animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle{ 0%,100%{opacity:.2;} 50%{opacity:1;} }

  h1{ font-size:1.5rem; text-align:center; margin:10px 0 4px; }
  .subtitle{ color:#b8bce8; font-size:.9rem; text-align:center; margin-bottom:24px; }

  .card{
    background:var(--card);
    color:var(--text-dark);
    border-radius:24px;
    padding:28px 22px;
    width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }

  label{ display:block; font-weight:700; margin:14px 0 6px; font-size:.95rem; color:#333; }
  input[type=text], input[type=tel]{
    width:100%; padding:16px; font-size:1.1rem; border-radius:14px;
    border:2px solid #e1e4f5; outline:none; background:#f7f8fd;
  }
  input:focus{ border-color:var(--accent); }

  .big-btn{
    width:100%;
    margin-top:22px;
    padding:18px;
    font-size:1.2rem;
    font-weight:800;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#5b8dff,#7b6bff);
    color:#fff;
    box-shadow:0 8px 18px rgba(91,141,255,.45);
    cursor:pointer;
    transition:transform .1s ease;
  }
  .big-btn:active{ transform:scale(.97); }
  .big-btn.secondary{ background:linear-gradient(135deg,#4ce0a1,#2bb583); box-shadow:0 8px 18px rgba(76,224,161,.4); }
  .big-btn.ghost{ background:#fff; color:var(--accent); border:2px solid var(--accent); box-shadow:none; }

  .notice-box{
    background:#fff3f3; color:#b23b3b; border:2px solid #ffcccc;
    padding:16px; border-radius:16px; text-align:center; font-weight:700; margin-top:14px;
  }

  /* 퀴즈 화면 */
  .quiz-top{ width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:.95rem; color:#dfe2ff; }
  .timer-wrap{ width:100%; height:14px; background:#2a2d5c; border-radius:10px; overflow:hidden; margin-bottom:18px; }
  .timer-bar{ height:100%; width:100%; background:linear-gradient(90deg,var(--ok),var(--accent2),var(--danger)); border-radius:10px; transition:width .1s linear; }

  .question-card{
    background:var(--card); color:var(--text-dark); border-radius:22px; padding:26px 20px;
    width:100%; text-align:center; box-shadow:0 10px 26px rgba(0,0,0,.3); margin-bottom:20px;
  }
  .q-number{ font-size:.85rem; color:#7b7fb3; font-weight:700; margin-bottom:8px; }
  .q-text{ font-size:1.25rem; font-weight:800; line-height:1.4; }

  .options{ width:100%; display:flex; flex-direction:column; gap:14px; }
  .option-btn{
    width:100%; padding:20px 16px; font-size:1.1rem; font-weight:700;
    border:none; border-radius:18px; background:#fff; color:var(--text-dark);
    box-shadow:0 6px 14px rgba(0,0,0,.25); cursor:pointer; text-align:left;
    display:flex; align-items:center; gap:12px; transition:transform .1s ease, background .2s;
  }
  .option-btn:active{ transform:scale(.97); }
  .option-btn .badge{
    width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:.95rem; flex-shrink:0;
  }
  .option-btn.correct{ background:var(--ok); color:#fff; }
  .option-btn.correct .badge{ background:#fff; color:var(--ok); }
  .option-btn.wrong{ background:var(--danger); color:#fff; }
  .option-btn.wrong .badge{ background:#fff; color:var(--danger); }
  .option-btn.disabled{ pointer-events:none; opacity:.85; }

  /* 결과 화면 */
  .result-summary{
    background:var(--card); color:var(--text-dark); border-radius:24px; padding:28px 22px;
    width:100%; text-align:center; box-shadow:0 10px 28px rgba(0,0,0,.35);
  }
  .stamp{
    display:inline-block; border:4px solid var(--danger); color:var(--danger);
    font-weight:900; padding:10px 18px; border-radius:14px; font-size:1.1rem;
    transform:rotate(-6deg); margin:14px 0; letter-spacing:1px;
  }
  .score-row{ display:flex; justify-content:space-around; margin:18px 0; }
  .score-box{ flex:1; }
  .score-box .num{ font-size:1.8rem; font-weight:900; color:var(--accent); }
  .score-box .label{ font-size:.85rem; color:#888; margin-top:4px; }

  .rank-card{
    background:var(--card); color:var(--text-dark); border-radius:22px; padding:22px;
    width:100%; margin-top:16px; box-shadow:0 10px 24px rgba(0,0,0,.3);
  }
  .rank-title{ font-weight:800; font-size:1.05rem; margin-bottom:12px; text-align:center; }
  .my-rank{
    background:#eef1ff; border-radius:14px; padding:14px; text-align:center; font-weight:800;
    color:var(--accent); margin-bottom:14px; font-size:1.05rem;
  }
  .leader-row{
    display:flex; align-items:center; justify-content:space-between; padding:10px 6px;
    border-bottom:1px solid #eee; font-weight:700;
  }
  .leader-row:last-child{ border-bottom:none; }
  .medal{ font-size:1.2rem; margin-right:8px; }

  .review-toggle{
    width:100%; margin-top:16px; padding:16px; border-radius:16px; border:2px dashed var(--accent);
    background:transparent; color:#eef1ff; font-weight:700; cursor:pointer; font-size:1rem;
  }
  .review-list{ width:100%; margin-top:14px; display:none; flex-direction:column; gap:12px; }
  .review-list.open{ display:flex; }
  .review-item{
    background:var(--card); color:var(--text-dark); border-radius:16px; padding:16px; text-align:left;
  }
  .review-item .rq{ font-weight:800; margin-bottom:8px; }
  .review-item .ra{ color:var(--ok); font-weight:700; margin-bottom:4px; }
  .review-item .rx{ color:var(--danger); font-weight:700; margin-bottom:6px; }
  .review-item .re{ color:#555; font-size:.9rem; line-height:1.4; }

  .prize{width:100%;margin-top:16px;border-radius:20px;padding:20px;background:#fff;color:var(--text-dark);text-align:left;font-size:.92rem;line-height:1.5}
  .prize h3{margin:0 0 8px;font-size:1.15rem}
  .prize .warn{background:#fff4d6;border-radius:12px;padding:10px 12px;font-size:.84rem}
  .prize .ok{background:#e3fff3;border-radius:12px;padding:10px 12px}
  .prize input[type=text],.prize input[type=tel]{width:100%;margin:4px 0 10px;padding:12px;border:2px solid #d5d9f5;border-radius:12px;font-size:1rem}
  .prize label.chk{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:.85rem;font-weight:700}
  .prize details{font-size:.8rem;color:#444;background:#f3f4fb;border-radius:10px;padding:8px 10px;margin:6px 0}
  .mini-btn{margin-top:10px;padding:10px 14px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
  .rank-card .loading,.result-summary .loading{ color:#555a80; }
  .result-summary .review-toggle{ color:var(--accent); }
  .loading{ text-align:center; color:#cfd2ff; margin-top:16px; font-size:.9rem; }
  .footer-note{ margin-top:26px; font-size:.75rem; color:#7d81ad; text-align:center; }
</style>
</head>
<body oncontextmenu="return false;">

<div class="stars" id="stars"></div>

<div id="app">

  <!-- ================= 시작 화면 ================= -->
  <div class="screen active" id="screen-start">
    <h1>🚀 우주 퀴즈 QR 골든벨</h1>
    <p class="subtitle">이름과 전화번호 뒷 4자리를 입력하고<br>우주 탐험을 시작해보세요!</p>
    <div class="card">
      <label for="inputName">이름</label>
      <input type="text" id="inputName" placeholder="예) 김민준" maxlength="10">
      <label for="inputPhone">휴대폰 번호 뒷 4자리</label>
      <input type="tel" id="inputPhone" placeholder="예) 1234" maxlength="4" inputmode="numeric">
      <button class="big-btn" id="btnStart">🌟 퀴즈 시작하기</button>
      <div class="notice-box" id="blockNotice" style="display:none;">
        😊 이미 참여하셨습니다!<br>참여해 주셔서 감사합니다.
      </div>
    </div>
    <button class="review-toggle" id="btnLookup">📊 내 순위 다시 확인하기 (이름·번호 입력 후)</button>
    <p class="footer-note">🎁 1위(정답 수 ↓ 소요시간 순)에게는 우주 도서를 집으로 보내드려요!<br>* 1인 1회 참여 가능합니다 (동일 기기 기준)</p>
  </div>

  <!-- ================= 퀴즈 화면 ================= -->
  <div class="screen" id="screen-quiz">
    <div class="quiz-top">
      <span id="qProgress">문제 1 / 15</span>
      <span id="qScore">맞은 개수: 0</span>
    </div>
    <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
    <div class="question-card">
      <div class="q-number" id="qNumber">Q1</div>
      <div class="q-text" id="qText">문제 내용</div>
    </div>
    <div class="options" id="optionsWrap"></div>
  </div>

  <!-- ================= 결과 화면 ================= -->
  <div class="screen" id="screen-result">
    <h1>🎉 미션 결과</h1>
    <div class="result-summary">
      <div class="stamp" id="stampText">미션 완료!</div>
      <div class="score-row">
        <div class="score-box">
          <div class="num" id="resultCorrect">0 / 15</div>
          <div class="label">맞춘 개수</div>
        </div>
        <div class="score-box">
          <div class="num" id="resultTime">0초</div>
          <div class="label">총 소요시간</div>
        </div>
      </div>
      <button class="review-toggle" id="btnReview">📖 틀린 문제 해설 보기</button>
    </div>

    <div class="review-list" id="reviewList"></div>

    <div class="rank-card">
      <div class="rank-title">🏆 실시간 랭킹</div>
      <div class="loading" id="rankLoading">순위를 불러오는 중...</div>
      <div id="rankContent" style="display:none;">
        <div class="my-rank" id="myRank">나의 순위: -</div>
        <div id="top3List"></div>
        <div class="loading" id="rankNote"></div>
        <button class="mini-btn" onclick="refresh(true)">🔄 지금 새로고침</button>
      </div>
    </div>
    <div class="prize" id="prizeCard" style="display:none"></div>

    <p class="footer-note">우주과학관 우주 퀴즈 QR 골든벨에 참여해 주셔서 감사합니다 🌌</p>
  </div>

</div>

<script>
/* =========================================================
   ⚠️ 아래 SCRIPT_URL 을 본인의 Google Apps Script 배포 URL로 교체하세요
   ========================================================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnMqcC1oWTyt2fe2r9uuJ9Ic-rQTD-DH2Be4b8--wadMy9bzUnuqgCtwMgKS6s3qbvIw/exec";

/* ---------------- 보안: 드래그/선택/우클릭 방지 ---------------- */
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- 배경 별 생성 ---------------- */
(function makeStars(){
  const wrap = document.getElementById('stars');
  const count = 60;
  for(let i=0;i<count;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = (Math.random()*3) + 's';
    s.style.width = s.style.height = (Math.random()*2+1) + 'px';
    wrap.appendChild(s);
  }
})();

/* ---------------- 퀴즈 데이터 (15문제, 우주 상식) ---------------- */
const QUIZ_BANK = [
  { q:"태양계에서 가장 큰 행성은 무엇일까요?", options:["목성","지구","화성"], answer:"목성", explain:"목성은 태양계에서 가장 큰 행성으로, 지구보다 약 11배 더 큽니다." },
  { q:"지구에서 가장 가까운 천체는 무엇일까요?", options:["태양","달","금성"], answer:"달", explain:"달은 지구의 유일한 자연 위성으로, 지구에서 가장 가까운 천체입니다." },
  { q:"태양계에서 태양과 가장 가까운 행성은?", options:["수성","금성","지구"], answer:"수성", explain:"수성은 태양에서 가장 가까운 첫 번째 행성입니다." },
  { q:"'빨간 행성'이라고 불리는 행성은?", options:["금성","화성","천왕성"], answer:"화성", explain:"화성은 표면의 산화철(녹) 때문에 붉은색을 띠어 '빨간 행성'이라 불립니다." },
  { q:"우리 은하의 이름은 무엇일까요?", options:["안드로메다 은하","우리은하(은하수)","소마젤란은하"], answer:"우리은하(은하수)", explain:"태양계가 속한 은하는 '우리은하' 또는 '은하수'라고 부릅니다." },
  { q:"사람이 최초로 달에 착륙한 우주선의 이름은?", options:["아폴로 11호","보이저 1호","스푸트니크 1호"], answer:"아폴로 11호", explain:"1969년 아폴로 11호가 인류 최초로 달에 착륙했습니다." },
  { q:"별이 반짝이는 이유는 무엇 때문일까요?", options:["별이 움직여서","지구 대기 때문에","별이 회전해서"], answer:"지구 대기 때문에", explain:"별빛이 지구 대기를 통과하며 굴절되어 반짝이는 것처럼 보입니다." },
  { q:"태양계에서 고리가 가장 유명한 행성은?", options:["토성","해왕성","지구"], answer:"토성", explain:"토성은 얼음과 암석으로 이루어진 아름다운 고리로 유명합니다." },
  { q:"우주비행사가 입는 옷을 무엇이라고 할까요?", options:["우주복","방한복","잠수복"], answer:"우주복", explain:"우주복은 우주의 진공과 온도 변화로부터 우주비행사를 보호합니다." },
  { q:"태양계에서 가장 작은 행성은?", options:["수성","화성","명왕성"], answer:"수성", explain:"수성은 태양계 8개 행성 중 크기가 가장 작습니다. (명왕성은 왜소행성입니다)" },
  { q:"블랙홀에 대한 설명으로 알맞은 것은?", options:["빛도 빠져나올 수 없는 천체","아주 밝은 별","작은 소행성"], answer:"빛도 빠져나올 수 없는 천체", explain:"블랙홀은 중력이 매우 강해 빛조차 빠져나올 수 없는 천체입니다." },
  { q:"별똥별(유성)의 정체는 무엇일까요?", options:["떨어지는 별 자체","대기권에서 타는 작은 돌 조각","달의 파편"], answer:"대기권에서 타는 작은 돌 조각", explain:"유성은 우주의 작은 돌 조각이 대기권에 진입하며 타는 현상입니다." },
  { q:"국제우주정거장의 약자는 무엇일까요?", options:["ISS","NASA","UFO"], answer:"ISS", explain:"ISS(International Space Station)는 여러 나라가 함께 운영하는 우주정거장입니다." },
  { q:"태양계에서 가장 큰 화산이 있는 행성은?", options:["화성","금성","목성"], answer:"화성", explain:"화성에는 태양계 최대 화산인 '올림푸스 몬스'가 있습니다." },
  { q:"우주에는 소리가 들릴까요?", options:["잘 들린다","공기가 없어 소리가 전달되지 않는다","가끔 들린다"], answer:"공기가 없어 소리가 전달되지 않는다", explain:"소리는 공기 같은 매질이 있어야 전달되는데, 우주는 진공이라 소리가 전달되지 않습니다." }
];

const TOTAL_QUESTIONS = 15;
const TIME_LIMIT_MS = 10000;

let userName = "";
let userPhone = "";
let quizSet = [];      // 섞인 문제+보기 세트
let currentIndex = 0;
let correctCount = 0;
let wrongDetails = [];  // {q, correct, picked, explain}
let quizStartTime = 0;
let timerInterval = null;
let timerStart = 0;
let answered = false;

/* ---------------- 유틸: 배열 셔플 ---------------- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ---------------- 화면 전환 ---------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ---------------- 기기 중복 참여 체크 ---------------- */
/* 테스트용: false = 중복 참여 제한 해제 / 실제 운영 시 true 로 변경 */
const ENABLE_DEVICE_LIMIT = false;

function hasAlreadyParticipated(){
  if(!ENABLE_DEVICE_LIMIT) return false;
  return localStorage.getItem('spacequiz_done') === 'true';
}
function markParticipated(){
  if(!ENABLE_DEVICE_LIMIT) return;
  localStorage.setItem('spacequiz_done', 'true');
}

window.addEventListener('DOMContentLoaded', () => {
  if(hasAlreadyParticipated()){
    document.getElementById('blockNotice').style.display = 'block';
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnStart').style.opacity = '0.5';
  }
});

/* ---------------- 퀴즈 시작 ---------------- */
document.getElementById('btnStart').addEventListener('click', () => {
  if(hasAlreadyParticipated()) return;
  const name = document.getElementById('inputName').value.trim();
  const phone = document.getElementById('inputPhone').value.trim();

  if(!name){ alert('이름을 입력해 주세요.'); return; }
  if(!/^\d{4}$/.test(phone)){ alert('휴대폰 번호 뒷 4자리를 숫자로 입력해 주세요.'); return; }

  userName = name;
  userPhone = phone;

  // 문제 순서 섞기 + 15문제 선택, 각 문제의 보기 순서도 섞기
  const shuffledQuestions = shuffleArray(QUIZ_BANK).slice(0, TOTAL_QUESTIONS);
  quizSet = shuffledQuestions.map(item => ({
    q: item.q,
    answer: item.answer,
    explain: item.explain,
    options: shuffleArray(item.options)
  }));

  currentIndex = 0;
  correctCount = 0;
  wrongDetails = [];
  quizStartTime = Date.now();

  showScreen('screen-quiz');
  renderQuestion();
});

/* ---------------- 문제 렌더링 ---------------- */
function renderQuestion(){
  answered = false;
  const item = quizSet[currentIndex];
  document.getElementById('qProgress').textContent = `문제 ${currentIndex+1} / ${TOTAL_QUESTIONS}`;
  document.getElementById('qScore').textContent = `맞은 개수: ${correctCount}`;
  document.getElementById('qNumber').textContent = `Q${currentIndex+1}`;
  document.getElementById('qText').textContent = item.q;

  const wrap = document.getElementById('optionsWrap');
  wrap.innerHTML = '';
  const labels = ['①','②','③'];
  item.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="badge">${idx+1}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(opt, btn));
    wrap.appendChild(btn);
  });

  startTimer();
}

/* ---------------- 타이머 (10초 게이지) ---------------- */
function startTimer(){
  clearInterval(timerInterval);
  const bar = document.getElementById('timerBar');
  bar.style.width = '100%';
  timerStart = Date.now();

  timerInterval = setInterval(() => {
    const elapsed = Date.now() - timerStart;
    const remainRatio = Math.max(0, 1 - elapsed / TIME_LIMIT_MS);
    bar.style.width = (remainRatio*100) + '%';
    if(elapsed >= TIME_LIMIT_MS){
      clearInterval(timerInterval);
      if(!answered) timeoutAnswer();
    }
  }, 80);
}

/* ---------------- 시간 초과 처리 ---------------- */
function timeoutAnswer(){
  answered = true;
  const item = quizSet[currentIndex];
  wrongDetails.push({ q:item.q, correct:item.answer, picked:'(시간 초과)', explain:item.explain });

  // 정답 표시만 하고 자동 다음 문제로
  highlightAnswer(null);
  setTimeout(nextQuestion, 900);
}

/* ---------------- 보기 선택 처리 ---------------- */
function selectAnswer(picked, btnEl){
  if(answered) return;
  answered = true;
  clearInterval(timerInterval);

  const item = quizSet[currentIndex];
  const isCorrect = picked === item.answer;
  if(isCorrect){
    correctCount++;
  } else {
    wrongDetails.push({ q:item.q, correct:item.answer, picked:picked, explain:item.explain });
  }
  highlightAnswer(btnEl);
  setTimeout(nextQuestion, 900);
}

/* ---------------- 정답/오답 하이라이트 ---------------- */
function highlightAnswer(clickedBtn){
  const item = quizSet[currentIndex];
  const buttons = document.querySelectorAll('#optionsWrap .option-btn');
  buttons.forEach(btn => {
    btn.classList.add('disabled');
    const label = btn.querySelector('span:last-child').textContent;
    if(label === item.answer){
      btn.classList.add('correct');
    } else if(btn === clickedBtn){
      btn.classList.add('wrong');
    }
  });
}

/* ---------------- 다음 문제로 이동 ---------------- */
function nextQuestion(){
  currentIndex++;
  if(currentIndex >= TOTAL_QUESTIONS){
    finishQuiz();
  } else {
    renderQuestion();
  }
}

/* ---------------- 퀴즈 종료 및 결과 처리 ---------------- */
function finishQuiz(){
  clearInterval(timerInterval);
  const totalTimeSec = Math.round((Date.now() - quizStartTime) / 1000);

  markParticipated();

  document.getElementById('resultCorrect').textContent = `${correctCount} / ${TOTAL_QUESTIONS}`;
  document.getElementById('resultTime').textContent = `${totalTimeSec}초`;

  let stamp = '🌟 우주 탐험가 인증 완료!';
  if(correctCount === TOTAL_QUESTIONS) stamp = '🏅 우주 박사 인증 완료!';
  else if(correctCount >= TOTAL_QUESTIONS*0.7) stamp = '🚀 우주 탐험가 인증 완료!';
  else if(correctCount >= TOTAL_QUESTIONS*0.4) stamp = '🛰️ 우주 견습생 인증 완료!';
  else stamp = '🌙 우주 입문자 인증 완료!';
  document.getElementById('stampText').textContent = stamp;

  renderReview();
  showScreen('screen-result');
  submitResult(totalTimeSec);
}

/* ---------------- 오답 노트 렌더링 ---------------- */
function renderReview(){
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  if(wrongDetails.length === 0){
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = `<div class="rq">🎉 모든 문제를 맞혔어요! 완벽해요!</div>`;
    list.appendChild(div);
    return;
  }
  wrongDetails.forEach((w, i) => {
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = `
      <div class="rq">Q. ${w.q}</div>
      <div class="ra">✅ 정답: ${w.correct}</div>
      <div class="rx">❌ 내가 고른 답: ${w.picked}</div>
      <div class="re">💡 ${w.explain}</div>
    `;
    list.appendChild(div);
  });
}

document.getElementById('btnReview').addEventListener('click', () => {
  const list = document.getElementById('reviewList');
  list.classList.toggle('open');
  document.getElementById('btnReview').textContent =
    list.classList.contains('open') ? '📖 해설 닫기' : '📖 틀린 문제 해설 보기';
});

/* ---------------- 마스킹 표시(참고용, 서버에서도 마스킹 처리됨) ---------------- */
function maskName(name){
  if(!name) return name;
  if(name.length <= 1) return name;
  if(name.length === 2) return name[0] + '*';
  return name[0] + '*'.repeat(name.length-2) + name[name.length-1];
}

/* ---------------- 서버 통신 / 순위·상품 ---------------- */
const PRIZE_NAME = '우주 관련 도서';
let me=null, pollT=null, prizeKey='', lookupMode=false;
const GET=p=>fetch(SCRIPT_URL+'?'+new URLSearchParams(p)).then(r=>r.json());
const POST=o=>fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(r=>r.json());
const $=id=>document.getElementById(id);

function submitResult(totalTimeSec){
  me={name:userName, phone:userPhone}; lookupMode=false; prizeKey='';
  POST({action:'submit', name:userName, phone:userPhone, correct:correctCount, time:totalTimeSec})
    .then(renderStatus).catch(netErr);
}
function netErr(e){ $('rankLoading').style.display='block'; $('rankLoading').innerHTML='⚠️ 순위 정보를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.<br><button class="mini-btn" onclick="refresh(true)">🔄 다시 시도</button>'; console.error(e); }
function refresh(manual){
  if(!me) return;
  GET({action:'status', name:me.name, phone:me.phone}).then(renderStatus).catch(manual?netErr:()=>{});
}
$('btnLookup').addEventListener('click', () => {
  const name=$('inputName').value.trim(), phone=$('inputPhone').value.trim();
  if(!name || !/^\d{4}$/.test(phone)){ alert('참여 때 입력한 이름과 번호 뒷 4자리를 입력해 주세요.'); return; }
  me={name,phone}; lookupMode=true; prizeKey='';
  $('stampText').textContent='📊 내 순위 확인'; $('btnReview').style.display='none'; $('reviewList').classList.remove('open');
  $('rankLoading').style.display='block'; $('rankLoading').textContent='순위를 불러오는 중...'; $('rankContent').style.display='none'; $('prizeCard').style.display='none';
  showScreen('screen-result'); refresh(true);
});

function renderStatus(d){
  if(d.error){ alert(d.error); if(lookupMode) showScreen('screen-start'); return; }
  $('rankLoading').style.display='none'; $('rankContent').style.display='block';
  $('resultCorrect').textContent=`${d.correct} / ${TOTAL_QUESTIONS}`; $('resultTime').textContent=`${d.time}초`;
  $('myRank').textContent=`나의 현재 순위: ${d.rank}위 (총 ${d.total}명)`;
  const medals=['🥇','🥈','🥉'], w=$('top3List'); w.innerHTML='';
  (d.top3||[]).forEach((r,i)=>{ const div=document.createElement('div'); div.className='leader-row';
    div.innerHTML=`<span><span class="medal">${medals[i]}</span>${r.name}</span><span>${r.correct}개 / ${r.time}초</span>`; w.appendChild(div); });
  $('rankNote').innerHTML = d.closed ? '🏁 행사가 종료되어 순위가 확정되었어요.' :
    '※ 다른 참가자가 참여할 때마다 순위가 바뀔 수 있어요.<br>순위는 ①정답 수 ②빠른 시간 ③먼저 참여한 순서로 정해져요.<br>이 화면은 30초마다 자동 갱신돼요. ('+new Date().toLocaleTimeString('ko-KR')+' 기준)';
  renderPrize(d);
  clearInterval(pollT); if(!d.closed) pollT=setInterval(()=>refresh(false),30000);
}

function renderPrize(d){
  const fk='sq_first_'+me.name+me.phone, first=d.rank===1;
  let st = first ? (d.claimed?'claimed':'open') : (localStorage.getItem(fk)?'lost':'wait');
  if(first) localStorage.setItem(fk,'1');
  const t1=(d.top3||[])[0], key=st+d.closed+(st==='wait'&&t1?t1.correct+'/'+t1.time:'');
  if(key===prizeKey) return;           // 입력 중인 폼이 갱신으로 지워지지 않도록
  prizeKey=key; const c=$('prizeCard'); c.style.display='block';
  const head=`<h3>🎁 1위 상품: ${PRIZE_NAME}</h3>`;
  if(st==='open') c.innerHTML=head+`<p>지금 <b>1위</b>예요! 🥇 상품을 집으로 보내드리려면 <b>배송 정보</b>가 필요해요. 1위가 아닌 분께는 주소·연락처를 받지 않아요.</p>
    <p class="warn">⚠️ 순위는 계속 바뀔 수 있어요. ${d.closed?'':'행사 종료 시점의 1위께만 발송돼요. 1위 자리를 내주면 입력하신 정보는 <b>즉시 자동 삭제</b>돼요. 이 화면에서 순위를 계속 확인해 주세요.'}</p>`+CLAIM_FORM;
  else if(st==='claimed') c.innerHTML=head+`<p class="ok">✅ 현재 1위이며 배송 정보가 등록되어 있어요.<br>${d.closed?'🎉 최종 1위 확정! 입력하신 연락처로 안내드릴게요.':'끝까지 1위를 지키면 발송돼요. 1위를 내주면 정보는 자동 삭제돼요.'}</p>
    ${d.closed?'':'<button class="mini-btn" onclick="showForm()">✏️ 정보 다시 입력하기</button><div id="reform"></div>'}`;
  else if(st==='lost') c.innerHTML=head+`<p class="warn">😢 아쉽게도 1위 자리를 다른 참가자에게 내주었어요.<br>입력하신 배송 정보는 <b>자동으로 삭제</b>되었어요.</p>`;
  else c.innerHTML=head+`<p>1위가 되면 이 자리에 <b>배송 정보 입력창</b>이 열려요.${t1?`<br>현재 1위 기록: <b>${t1.correct}개 / ${t1.time}초</b>`:''}</p>
    <p class="warn">수령 주소·연락처는 1위에게만, 개인정보 동의 후에 받아요.</p>`;
}
function showForm(){ $('reform').innerHTML=CLAIM_FORM; }

const CLAIM_FORM=`<div class="pf">
  <label>받는 분 이름<input type="text" id="cName" maxlength="20" autocomplete="off"></label>
  <label>연락처 (숫자만)<input type="tel" id="cTel" maxlength="13" inputmode="numeric" placeholder="01012345678"></label>
  <label>주소 (동·호수까지 자세히 적어 주세요)<input type="text" id="cAddr" maxlength="150" placeholder="예) 인천시 ○○구 ○○로 12, 101동 1203호"></label>
  <details><summary>개인정보 수집·이용 안내 (펼쳐서 확인)</summary>
    · 수집 주체: 우주과학관<br>· 수집 항목: 받는 분 이름, 연락처, 주소(동·호수 포함)<br>· 이용 목적: 1위 상품 배송 및 당첨 안내<br>
    · 보유 기간: 상품 발송 후 30일 이내 파기 (1위를 내준 경우 즉시 삭제)<br>
    · 동의를 거부할 수 있으며, 거부 시 상품 발송이 어렵습니다.<br>· 상품은 국내 배송만 가능합니다.<br>· 주소나 연락처가 정확하지 않거나 빠져 있으면 배송이 어려울 수 있어요. 제출 전에 한 번만 더 확인해 주세요.</details>
  <label class="chk"><input type="checkbox" id="cConsent"> [필수] 위 개인정보 수집·이용에 동의합니다.</label>
  <label class="chk"><input type="checkbox" id="cAge"> [필수] 만 14세 이상이거나, 만 14세 미만인 경우 법정대리인의 동의를 받았습니다.</label>
  <button class="big-btn" onclick="sendClaim()">📦 배송 정보 제출</button></div>`;

function sendClaim(){
  const g=id=>$(id).value.trim(), tel=g('cTel').replace(/-/g,'');
  if(!g('cName')||g('cAddr').length<8) return alert('받는 분 이름과 주소(동·호수까지)를 자세히 입력해 주세요.');
  if(!/^01\d{8,9}$/.test(tel)) return alert('연락처를 휴대폰 번호 형식으로 입력해 주세요.');
  if(!$('cConsent').checked||!$('cAge').checked) return alert('필수 동의 항목에 체크해 주세요.');
  POST({action:'claim', name:me.name, phone:me.phone, receiver:g('cName'), tel, addr:g('cAddr'), consent:true})
   .then(r=>{ if(!r.ok) return alert(r.error||'제출에 실패했어요.'); alert('✅ 등록되었어요! 1위를 지키면 발송해 드려요.'); prizeKey=''; refresh(true); })
   .catch(()=>alert('네트워크 오류가 발생했어요. 다시 시도해 주세요.'));
}
</script>
